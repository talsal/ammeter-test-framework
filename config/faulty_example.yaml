# Error-simulation example: the same setup as config.yaml, but the emulators misbehave on purpose.
#   python main.py run --config config/faulty_example.yaml --label faults
# Faults are drawn from a seeded generator, so every run injects the same pattern.
# Each request suffers at most one fault. Retries (client.retries) can recover drop/garbage/delay
# faults; an ERROR reply is a deliberate refusal and is not retried.

testing:
  sampling:
    measurements_count: 30
    total_duration_seconds: null
    sampling_frequency_hz: 20

ammeters:
  greenlee:                       # healthy: the reference for comparison
    host: 127.0.0.1
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
  entes:                          # flaky link: connections dropped or answered with garbage
    host: 127.0.0.1
    port: 5001
    command: "MEASURE_ENTES -get_data"
    faults: {drop_rate: 0.20, garbage_rate: 0.10, seed: 7}
  circutor:                       # unreliable device: slow replies (beyond the 0.5 s timeout) and error replies
    host: 127.0.0.1
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement -current"
    faults: {delay_rate: 0.10, delay_seconds: 1.0, error_rate: 0.15, seed: 7}

client:
  timeout_seconds: 0.5
  retries: 2
  retry_delay_seconds: 0.05

analysis:
  outlier_z_threshold: 3.0
  visualization:
    enabled: true
    plot_types: [histogram, time_series, precision]

result_management:
  directory: results

logging:
  level: WARNING
  to_file: true
